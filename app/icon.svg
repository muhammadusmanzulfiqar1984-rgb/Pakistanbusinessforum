<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PBF">
  <defs>
    <radialGradient id="navy" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#1a3870"/>
      <stop offset="55%" stop-color="#0f2456"/>
      <stop offset="100%" stop-color="#050f28"/>
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8edf5"/>
      <stop offset="50%" stop-color="#c0c8d8"/>
      <stop offset="100%" stop-color="#8a96b0"/>
    </linearGradient>
  </defs>
  <!-- Navy crest -->
  <circle cx="32" cy="32" r="30" fill="url(#navy)" stroke="#c0c8d8" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#c0c8d8" stroke-width="0.6" stroke-opacity="0.35"/>
  <!-- Globe -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#silver)" stroke-width="1.2"/>
  <ellipse cx="32" cy="32" rx="16" ry="6" fill="none" stroke="url(#silver)" stroke-width="0.7"/>
  <ellipse cx="32" cy="32" rx="16" ry="11" fill="none" stroke="url(#silver)" stroke-width="0.7"/>
  <line x1="32" y1="16" x2="32" y2="48" stroke="url(#silver)" stroke-width="0.7"/>
  <line x1="16" y1="32" x2="48" y2="32" stroke="url(#silver)" stroke-width="0.7"/>
  <!-- Initials -->
  <text x="32" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="url(#silver)" letter-spacing="-0.3">PBF</text>
</svg>
