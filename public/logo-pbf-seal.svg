<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pakistan Business Forum emblem" fill="none">
  <defs>
    <linearGradient id="pbfSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e1e6ed"/>
      <stop offset="55%" stop-color="#c0c7d1"/>
      <stop offset="100%" stop-color="#9ea7b3"/>
    </linearGradient>
  </defs>

  <!-- Outer seal -->
  <circle cx="100" cy="100" r="92" stroke="url(#pbfSilver)" stroke-width="1.6"/>
  <circle cx="100" cy="100" r="86" stroke="#c0c7d1" stroke-width="0.6" stroke-opacity="0.6"/>
  <circle cx="100" cy="100" r="58" stroke="#c0c7d1" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- Globe -->
  <g stroke="url(#pbfSilver)" stroke-width="1.5" stroke-linecap="round">
    <circle cx="100" cy="100" r="32"/>
    <line x1="100" y1="68" x2="100" y2="132"/>
    <line x1="68" y1="100" x2="132" y2="100"/>
    <ellipse cx="100" cy="100" rx="32" ry="13"/>
    <ellipse cx="100" cy="100" rx="32" ry="22"/>
    <ellipse cx="100" cy="100" rx="13" ry="32"/>
  </g>

  <!-- Laurel branch (left) -->
  <g fill="url(#pbfSilver)" stroke="#c0c7d1" stroke-width="0.5">
    <path d="M40 96 Q30 70 44 42" fill="none" stroke="url(#pbfSilver)" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="33" cy="88" rx="6.5" ry="3.2" transform="rotate(-55 33 88)"/>
    <ellipse cx="30" cy="76" rx="6.5" ry="3.2" transform="rotate(-65 30 76)"/>
    <ellipse cx="30" cy="64" rx="6.5" ry="3.2" transform="rotate(-75 30 64)"/>
    <ellipse cx="33" cy="52" rx="6.5" ry="3.2" transform="rotate(-85 33 52)"/>
    <ellipse cx="40" cy="42" rx="6.5" ry="3.2" transform="rotate(-100 40 42)"/>
    <ellipse cx="46" cy="92" rx="6.5" ry="3.2" transform="rotate(60 46 92)"/>
    <ellipse cx="42" cy="80" rx="6.5" ry="3.2" transform="rotate(50 42 80)"/>
    <ellipse cx="42" cy="68" rx="6.5" ry="3.2" transform="rotate(40 42 68)"/>
    <ellipse cx="44" cy="56" rx="6.5" ry="3.2" transform="rotate(25 44 56)"/>
  </g>

  <!-- Laurel branch (right, mirrored) -->
  <g fill="url(#pbfSilver)" stroke="#c0c7d1" stroke-width="0.5">
    <path d="M160 96 Q170 70 156 42" fill="none" stroke="url(#pbfSilver)" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="167" cy="88" rx="6.5" ry="3.2" transform="rotate(55 167 88)"/>
    <ellipse cx="170" cy="76" rx="6.5" ry="3.2" transform="rotate(65 170 76)"/>
    <ellipse cx="170" cy="64" rx="6.5" ry="3.2" transform="rotate(75 170 64)"/>
    <ellipse cx="167" cy="52" rx="6.5" ry="3.2" transform="rotate(85 167 52)"/>
    <ellipse cx="160" cy="42" rx="6.5" ry="3.2" transform="rotate(100 160 42)"/>
    <ellipse cx="154" cy="92" rx="6.5" ry="3.2" transform="rotate(-60 154 92)"/>
    <ellipse cx="158" cy="80" rx="6.5" ry="3.2" transform="rotate(-50 158 80)"/>
    <ellipse cx="158" cy="68" rx="6.5" ry="3.2" transform="rotate(-40 158 68)"/>
    <ellipse cx="156" cy="56" rx="6.5" ry="3.2" transform="rotate(-25 156 56)"/>
  </g>

  <!-- Top star -->
  <path d="M100 14 L102.5 22 L111 22.4 L104 27.4 L106.4 35.4 L100 30.6 L93.6 35.4 L96 27.4 L89 22.4 L97.5 22 Z" fill="url(#pbfSilver)"/>

  <!-- Bottom ribbon flourish -->
  <g stroke="url(#pbfSilver)" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M62 162 Q100 178 138 162"/>
    <path d="M70 168 L62 174"/>
    <path d="M130 168 L138 174"/>
  </g>
</svg>
