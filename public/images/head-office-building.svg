<svg width="1600" height="1200" viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for building facade -->
    <linearGradient id="facadeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e5e2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4d0cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4bfba;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for windows -->
    <linearGradient id="windowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8c5d8;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#7aa8c5;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#5a8db0;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Shadow gradient -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </linearGradient>
    
    <!-- Building highlight -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Ground shadow -->
  <ellipse cx="800" cy="1150" rx="500" ry="30" fill="#000000" opacity="0.08"/>
  
  <!-- Main building structure - perspective view -->
  <g id="main-building">
    <!-- Left facade -->
    <path d="M 400 200 L 400 1000 L 200 1100 L 200 300 Z" fill="url(#facadeGradient)" stroke="#b8b3ae" stroke-width="1" opacity="0.9"/>
    
    <!-- Front facade -->
    <rect x="400" y="200" width="600" height="800" fill="url(#facadeGradient)" stroke="#b8b3ae" stroke-width="1" opacity="0.9"/>
    
    <!-- Right facade -->
    <path d="M 1000 200 L 1000 1000 L 1200 1100 L 1200 300 Z" fill="url(#facadeGradient)" stroke="#b8b3ae" stroke-width="1" opacity="0.85"/>
    
    <!-- Roof structure -->
    <path d="M 400 200 L 1000 200 L 1200 300 L 200 300 Z" fill="#c8c3be" stroke="#a8a39e" stroke-width="1" opacity="0.8"/>
    
    <!-- Building highlight on front facade -->
    <rect x="400" y="200" width="600" height="800" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Windows - Front facade -->
  <g id="windows-front">
    <!-- Row 1 -->
    <rect x="450" y="280" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="560" y="280" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="670" y="280" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="780" y="280" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="890" y="280" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    
    <!-- Row 2 -->
    <rect x="450" y="430" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="560" y="430" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="670" y="430" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="780" y="430" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="890" y="430" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    
    <!-- Row 3 -->
    <rect x="450" y="580" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="560" y="580" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="670" y="580" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="780" y="580" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="890" y="580" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    
    <!-- Row 4 -->
    <rect x="450" y="730" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="560" y="730" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="670" y="730" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="780" y="730" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="890" y="730" width="80" height="120" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    
    <!-- Row 5 -->
    <rect x="450" y="880" width="80" height="100" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="560" y="880" width="80" height="100" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="670" y="880" width="80" height="100" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="780" y="880" width="80" height="100" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
    <rect x="890" y="880" width="80" height="100" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Window frames -->
  <g id="window-frames" stroke="#6a7a88" stroke-width="1" fill="none" opacity="0.3">
    <!-- Vertical dividers -->
    <line x1="490" y1="280" x2="490" y2="400"/>
    <line x1="600" y1="280" x2="600" y2="400"/>
    <line x1="710" y1="280" x2="710" y2="400"/>
    <line x1="820" y1="280" x2="820" y2="400"/>
    <line x1="930" y1="280" x2="930" y2="400"/>
    
    <!-- Horizontal dividers -->
    <line x1="450" y1="340" x2="530" y2="340"/>
    <line x1="560" y1="340" x2="640" y2="340"/>
    <line x1="670" y1="340" x2="750" y2="340"/>
    <line x1="780" y1="340" x2="860" y2="340"/>
    <line x1="890" y1="340" x2="970" y2="340"/>
  </g>
  
  <!-- Main entrance -->
  <g id="entrance">
    <rect x="650" y="900" width="100" height="100" fill="#9a8a7a" stroke="#7a6a5a" stroke-width="2" opacity="0.7"/>
    <rect x="660" y="910" width="80" height="80" fill="#d4c8b8" stroke="#b4a898" stroke-width="1" opacity="0.6"/>
    <!-- Door frame -->
    <rect x="680" y="930" width="40" height="60" fill="#6a5a4a" stroke="#4a3a2a" stroke-width="1" opacity="0.5"/>
    <!-- Steps -->
    <rect x="640" y="1000" width="120" height="8" fill="#b8a898" stroke="#988878" stroke-width="1" opacity="0.6"/>
    <rect x="645" y="1008" width="110" height="8" fill="#c8b8a8" stroke="#a89888" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Architectural details - horizontal bands -->
  <g id="architectural-bands" stroke="#a8a39e" stroke-width="2" fill="none" opacity="0.4">
    <line x1="400" y1="250" x2="1000" y2="250"/>
    <line x1="400" y1="400" x2="1000" y2="400"/>
    <line x1="400" y1="550" x2="1000" y2="550"/>
    <line x1="400" y1="700" x2="1000" y2="700"/>
    <line x1="400" y1="850" x2="1000" y2="850"/>
  </g>
  
  <!-- Building shadow on ground -->
  <path d="M 200 1100 L 1200 1100 L 1200 1200 L 200 1200 Z" fill="url(#shadowGradient)" opacity="0.1"/>
  
  <!-- Left side windows (perspective) -->
  <g id="windows-left" opacity="0.4">
    <rect x="250" y="350" width="60" height="90" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
    <rect x="250" y="480" width="60" height="90" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
    <rect x="250" y="610" width="60" height="90" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
    <rect x="250" y="740" width="60" height="90" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
    <rect x="250" y="870" width="60" height="80" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
  </g>
  
  <!-- Right side windows (perspective) -->
  <g id="windows-right" opacity="0.35">
    <rect x="1050" y="350" width="60" height="90" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
    <rect x="1050" y="480" width="60" height="90" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
    <rect x="1050" y="610" width="60" height="90" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
    <rect x="1050" y="740" width="60" height="90" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
    <rect x="1050" y="870" width="60" height="80" fill="url(#windowGradient)" stroke="#8a9ba8" stroke-width="1"/>
  </g>
  
  <!-- Corner details and depth -->
  <g id="corner-details" stroke="#9a9590" stroke-width="1" fill="none" opacity="0.3">
    <line x1="400" y1="200" x2="400" y2="1000"/>
    <line x1="1000" y1="200" x2="1000" y2="1000"/>
  </g>
</svg>
